name: Coleta diária e publicação
on:
  schedule:
    - cron: "30 8 * * *"   # 05h30 de Brasília
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: coleta
  cancel-in-progress: false
jobs:
  coletar:
    runs-on: ubuntu-latest
    outputs:
      falhou: ${{ steps.coleta.outputs.falhou }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # re-run também parte da versão mais nova, não da antiga
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Testes das regras
        run: python3 -m unittest discover -s tests
      - name: Testes do placar
        run: node --test tests/placar.test.js
      - name: Coleta (cidade que falha mantém o último arquivo bom)
        id: coleta
        if: github.event_name != 'push'
        run: python3 -m coletor.coletar || echo "falhou=1" >> "$GITHUB_OUTPUT"
      - name: Guarda os dados novos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/dados
          git diff --cached --quiet && exit 0
          git commit -m "dados: coleta de $(date -u +%F)"
          git pull --rebase -X theirs   # se colidir, vale o dado recém-coletado
          git push
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  publicar:
    needs: coletar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
  avisar:
    # publica o que há de bom e depois fica vermelho, para a falha não passar em silêncio
    needs: [coletar, publicar]
    if: needs.coletar.outputs.falhou == '1'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "::error::Alguma cidade falhou na coleta. O site segue com o último arquivo bom. Veja o passo Coleta."
          exit 1
